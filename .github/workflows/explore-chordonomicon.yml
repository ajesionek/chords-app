name: Sprawdź bazę Chordonomicon
on:
  push:
    branches: [explore/chordonomicon]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Statystyki
        run: |
          pip -q install pandas
          curl -sL -o chordonomicon.csv https://huggingface.co/datasets/ailsntua/Chordonomicon/resolve/main/chordonomicon_v2.csv
          python3 tools/chordonomicon_stats.py
